<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Fovea — the point of sharpest vision.
    A luminous core with focus rings converging on it: resolution refined
    to its center. The broken middle ring keeps the mark open, not a target.
    Source of truth for every brand surface; rasterize with scripts/make-icon.mjs
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26313f"/>
      <stop offset="1" stop-color="#0f141b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8def" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.34" r="0.95">
      <stop offset="0" stop-color="#dbe7ff"/>
      <stop offset="0.45" stop-color="#8ab1ff"/>
      <stop offset="1" stop-color="#4d80f2"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="192" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="360" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="448" fill="none" stroke="#3d5169" stroke-width="30" opacity="0.5"/>
  <path d="M 805.1 283 A 372 372 0 1 1 563.8 143.6" fill="none" stroke="#58728f" stroke-width="56" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="228" fill="none" stroke="#7f98b5" stroke-width="62"/>
  <circle cx="512" cy="512" r="104" fill="url(#core)"/>
</svg>
