[package]
name = "local-ai-image-upscaler"
version = "0.1.0"
description = "Pixora — professional local AI image enhancement for Windows. Your images never leave your machine."
authors = ["Pixora"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "upscaler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = { version = "2", features = [] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Only the Stage 03 codecs — no default feature set. New formats are added
# here (plus the Format mapping in services/import.rs), nowhere else.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
# Stage 05 — local AI inference. `ort` wraps Microsoft's ONNX Runtime
# (MIT-licensed runtime binary, downloaded + copied into the bundle at
# build time). DirectML = GPU acceleration on any DirectX 12 adapter with
# no CUDA dependency; CPU is the automatic fallback. `download-binaries`
# and `copy-dylibs` only ever contact Microsoft's CDN at *build* time —
# the finished app makes zero network calls. Telemetry is explicitly
# disabled at init (see services/inference/backend.rs).
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "copy-dylibs", "directml", "api-27"] }
# Model integrity: SHA-256 verification in the model manager.
sha2 = "0.10"
# Streaming PNG output encoder (row-at-a-time, keeps peak memory bounded).
# Same major the `image` crate already pulls — declared explicitly because
# the encoder API lives here, not behind `image`.
png = "0.18"
# Stage 06 export: lossy WebP encoding. `image`'s built-in WebP encoder is
# lossless-only, and a "quality" slider for WebP must mean real VP8 quality
# — so the actual libwebp encoder (vendored C source compiled at build
# time; zero runtime downloads, matching the app's no-network promise).
# `img` feature off: we encode from raw pixel buffers, not DynamicImage.
webp = { version = "0.3", default-features = false }

# Stage 13 licensing: Ed25519 signature verification for offline license
# keys. One of the smallest audited Ed25519 implementations; verification
# only ever needs the *public* key embedded in the app (the private half
# lives with the vendor tooling and never in this repo for release keys).
ed25519-compact = "2"

# Stage 07 hardware detection: DXGI adapter enumeration + a D3D12 feature
# probe (the honest "can DirectML run here" question), memory status, CPU
# topology, and the process working set for the benchmark harness. 0.61 is
# the windows-rs major Tauri's own usage already pins in the lockfile —
# one binding set, no duplicate metadata.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Security_Credentials",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# Release profile tuned for a small, fast native binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
