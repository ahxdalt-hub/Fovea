[package]
name = "local-ai-image-upscaler"
version = "0.1.0"
description = "Pixora — professional local AI image enhancement for Windows. Your images never leave your machine."
authors = ["Pixora"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "upscaler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = { version = "2", features = [] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Release profile tuned for a small, fast native binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
