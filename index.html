<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Fovea</title>
    <style>
      /* Paint the window background before JS boots to avoid a white flash.
         Light is the default; the script below only goes dark when the
         user's own persisted choice says so. */
      html {
        background: #f4f5f7;
      }
      html[data-theme='dark'] {
        background: #101215;
      }
    </style>
    <script>
      // Read the persisted theme before first paint: set [data-theme='dark']
      // (and the matching background) only for an explicit dark choice, or
      // for 'system' on a machine whose OS prefers dark. Everything else —
      // including a fresh install — paints light.
      try {
        var stored = JSON.parse(localStorage.getItem('fovea:settings') || '{}')
        var theme = (stored.general && stored.general.theme) || 'light'
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        } else if (theme === 'system') {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } else {
          // Pin light explicitly: without the attribute, the prefers-color-scheme
          // block in tokens.css would give a dark-OS machine dark tokens.
          document.documentElement.setAttribute('data-theme', 'light')
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
